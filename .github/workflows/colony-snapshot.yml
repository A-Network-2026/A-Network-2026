name: Colony Monthly Snapshot

# Runs twice a day (00:30 UTC, 30 min after the page's monthly reset window,
# and again at 06:30 UTC). The script keeps the daily maximum per owner, so a
# second sample never inflates the data; it only covers the first run failing
# while the upstream API is cold. Can also be triggered manually for testing.
on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: colony-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run snapshot script
        env:
          ANET_STATS_ENDPOINT: https://api.a-network.net/colony-rewards/leaderboard?limit=200
          ANET_SNAPSHOT_RETRIES: '6'
          ANET_SNAPSHOT_TIMEOUT_MS: '90000'
        run: node scripts/colony-snapshot.js

      - name: Commit & push if changed
        run: |
          set -e
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No snapshot changes; nothing to commit."
            exit 0
          fi
          git config user.name  "anet-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: colony snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          # main may have moved while the job ran; rebase the data commit on top.
          git pull --rebase origin main
          git push origin HEAD:main
